services:
  # Web Application
  - type: web
    name: landfall-web
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: landfall-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_LIPP_REDIRECT
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Groq models actually available on the free key (llama-3.x is NOT available).
      - key: GROQ_MODEL_REASONING
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: GROQ_MODEL_GUARD
        value: meta-llama/llama-prompt-guard-2-86m
      - key: GROQ_MODEL_SAFEGUARD
        value: openai/gpt-oss-safeguard-20b
      - key: GROQ_MODEL_STT
        value: whisper-large-v3-turbo
      # Signs session cookies. Render generates a strong value once.
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBAUTHN_RP_ID
        value: landfall-web.onrender.com
      - key: WEBAUTHN_ORIGIN
        value: https://landfall-web.onrender.com
      - key: PAYOUT_REFRESH_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_AG_GRID_LICENSE
        sync: false
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: JUDGE_MODE_ENABLED
        value: "true"
      - key: NWS_USER_AGENT
        value: "Landfall mutual-aid hackathon app (contact: bharathadithya)"
      - key: APP_URL
        sync: false

  # Sentinel Cron Poller (Every 5 Minutes)
  - type: cron
    name: landfall-sentinel-cron
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: pnpm install
    startCommand: pnpm run cron:poll
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: landfall-web
          envVarKey: CRON_SECRET

databases:
  - name: landfall-db
    databaseName: landfall
    plan: starter
