services:
  # Web Application
  - type: web
    name: landfall-web
    runtime: node
    plan: free
    # db:push creates/updates tables from lib/db/schema.ts. --force only answers drizzle's prompts; the database is ours and starts empty.
    buildCommand: pnpm install && pnpm db:push --force && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: landfall-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_LIPP_REDIRECT
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Groq models actually available on the free key (llama-3.x is NOT available).
      - key: GROQ_MODEL_REASONING
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: GROQ_MODEL_GUARD
        value: meta-llama/llama-prompt-guard-2-86m
      - key: GROQ_MODEL_SAFEGUARD
        value: openai/gpt-oss-safeguard-20b
      - key: GROQ_MODEL_STT
        value: whisper-large-v3-turbo
      # Signs session cookies. Render generates a strong value once.
      - key: SESSION_SECRET
        generateValue: true
      # Set after the first deploy, once Render shows the real URL (e.g. my-service.onrender.com / https://my-service.onrender.com)
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: PAYOUT_REFRESH_ENABLED
        value: "true"
      # Server-side only: household id -> Sandbox receiver, e.g. {"hh_tbw_001":"sb-...@personal.example.com"}. Never returned by any API.
      - key: SANDBOX_RECEIVERS
        sync: false
      # Labelled demo approval PIN shown on /judges (used when a device has no passkey).
      - key: DEMO_APPROVAL_PIN
        value: "246810"
      - key: LIVE_PAYOUT_MAX_ITEM_CENTS
        value: "10000"
      - key: LIVE_PAYOUT_MAX_TOTAL_CENTS
        value: "5000"
      - key: NEXT_PUBLIC_AG_GRID_LICENSE
        sync: false
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: JUDGE_MODE_ENABLED
        value: "true"
      - key: NWS_USER_AGENT
        value: "Landfall mutual-aid hackathon app (contact: bharathadithya)"
      - key: APP_URL
        sync: false

  # No cron service: Render cron jobs have no free tier. Refresh payouts with the "Refresh from PayPal" button, or run
  # `pnpm run cron:poll` from any scheduler (it calls /api/alerts/poll and /api/payouts/refresh-due with CRON_SECRET).

databases:
  - name: landfall-db
    databaseName: landfall
    plan: free
